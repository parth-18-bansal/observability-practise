name: day-1-lgtm-stack
services:
  
  # grafana is for visualising metrics and logs
  grafana:
    image: grafana/grafana:latest
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_FEATURE_TOGGLES_ENABLE: "flameGraph traceqlEditor"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    healthcheck:
      test: ["CMD-SHELL","wget -qO- http://localhost:3000/api/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  # prometheus is for collecting metrics and alerts
  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]
    command: ["--config.file=/etc/prometheus/prometheus.yml","--web.enable-remote-write-receiver"]
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml"]
  

  # loki is for collecting the logs
  loki:
    image: grafana/loki:3.7.7
    command: ["--config.file=/etc/loki/local-config.yaml"]
    ports: ["3100:3100"]
