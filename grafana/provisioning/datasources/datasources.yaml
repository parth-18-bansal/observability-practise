apiversion: 1

# prometheus stores data, and grafana query the data and then display it.
# so here we are configuring grafana that you can query data from here
datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    url: http://prometheus:9090
    isDefault: true
  - name: Loki
    type: loki
    uid: loki
    url: http://loki:3100
    jsonData:
      derivedFields:
        - name: TraceID
          matcherRegex: '"trace_id":"(\w+)"'
          url: '$${__value.raw}'
          datasourceUid: tempo
  - name: Tempo
    type: tempo
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
      tracesToMetrics:
        datasourceUid: prometheus
  - name: Mimir
    type: Prometheus
    uid: mimir
    url: http://mimir:9009/prometheus
  - name: Pyroscope
    type: grafana-pyroscope-datasources
    uid: pyroscope
    url: http://pyroscope:4040